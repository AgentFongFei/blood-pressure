<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>血壓紀錄</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>血壓紀錄</h1>
    <div id="authArea">
      <span id="userLabel"></span>
      <button id="loginBtn" class="btn">使用 Google 登入</button>
      <button id="logoutBtn" class="btn ghost" hidden>登出</button>
    </div>
  </header>

  <main>
    <p id="notice" class="notice" hidden></p>

    <section class="card">
      <h2>新增紀錄</h2>
      <form id="recordForm" class="grid">
        <label>日期
          <input type="date" id="date" required>
        </label>
        <label>姓名
          <input type="text" id="name" list="nameList" placeholder="例如：王小明" required>
          <datalist id="nameList"></datalist>
        </label>
        <label>最高血壓（收縮壓）
          <input type="number" id="systolic" min="40" max="300" inputmode="numeric" placeholder="mmHg" required>
        </label>
        <label>最低血壓（舒張壓）
          <input type="number" id="diastolic" min="20" max="200" inputmode="numeric" placeholder="mmHg" required>
        </label>
        <label>心率
          <input type="number" id="pulse" min="20" max="250" inputmode="numeric" placeholder="次/分" required>
        </label>
        <div class="actions">
          <button type="submit" class="btn primary" id="saveBtn">儲存</button>
          <span id="saveMsg" class="msg"></span>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="card-head">
        <div class="tabs" role="tablist">
          <button type="button" class="tab active" data-tab="chartTab" role="tab">折線圖</button>
          <button type="button" class="tab" data-tab="tableTab" role="tab">紀錄表格</button>
        </div>
        <div class="filters">
          <label class="inline">姓名
            <select id="nameFilter"></select>
          </label>
          <label class="inline">期間
            <select id="rangeFilter">
              <option value="7">最近 7 天</option>
              <option value="30" selected>最近 30 天</option>
              <option value="90">最近 3 個月</option>
              <option value="365">最近 1 年</option>
              <option value="all">全部</option>
              <option value="custom">自訂…</option>
            </select>
          </label>
          <span id="customRange" class="inline" hidden>
            <input type="date" id="rangeStart" aria-label="開始日期">
            <span>～</span>
            <input type="date" id="rangeEnd" aria-label="結束日期">
          </span>
        </div>
      </div>
      <p id="emptyMsg" class="msg" hidden>這段期間沒有這個人的紀錄。</p>

      <div id="chartTab" class="tab-panel">
        <h3>血壓</h3>
        <div class="chart-box"><canvas id="bpChart"></canvas></div>
        <h3>心率</h3>
        <div class="chart-box"><canvas id="pulseChart"></canvas></div>
      </div>

      <div id="tableTab" class="tab-panel" hidden>
        <div class="table-wrap">
          <table>
            <thead><tr><th>日期</th><th>最高血壓</th><th>最低血壓</th><th>心率</th><th></th></tr></thead>
            <tbody id="recordRows"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
